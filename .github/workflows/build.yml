name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target CosmicFeedbackKiller_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: CosmicFeedbackKiller-VST3
          path: build/CosmicFeedbackKiller_artefacts/Release/VST3
